name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts-and-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contracts/ts/package-lock.json

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install contracts deps
        working-directory: contracts/ts
        run: npm ci

      - name: Build contracts
        working-directory: contracts/ts
        run: npm run build

      - name: Protocol conformance vectors
        working-directory: contracts/ts
        run: npm run check:vectors

      - name: Model promotion traceability
        working-directory: contracts/ts
        run: npm run check:models

      - name: Generated drift check
        working-directory: contracts/ts
        run: npm run check:drift

      - name: Presentation conformance (state bindings + WCAG contrast + a11y)
        working-directory: contracts/ts
        run: npm run check:presentation

      - name: Presentation check meta-test (check can fail)
        working-directory: contracts/ts
        run: npm run test:presentation

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
