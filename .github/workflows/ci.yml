name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts-and-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contracts/ts/package-lock.json

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.71.0

      # Rust is needed for protoc-gen-prost, the generator of the committed
      # Rust bindings; the drift check regenerates both targets.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc-gen-prost (pinned — generator of record)
        run: cargo install protoc-gen-prost --version 0.5.0 --locked

      - name: Install contracts deps
        working-directory: contracts/ts
        run: npm ci

      - name: Build contracts
        working-directory: contracts/ts
        run: npm run build

      - name: Generated-code drift check
        working-directory: contracts/ts
        run: npm run check:drift

      - name: Protocol conformance vectors
        working-directory: contracts/ts
        run: npm run check:vectors

      - name: Model promotion traceability
        working-directory: contracts/ts
        run: npm run check:models

      - name: Presentation conformance (state bindings + WCAG contrast + a11y)
        working-directory: contracts/ts
        run: npm run check:presentation

      - name: Presentation check meta-test (check can fail)
        working-directory: contracts/ts
        run: npm run test:presentation

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  typescript-suites:
    needs: [contracts-and-conformance, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            contracts/ts/package-lock.json
            web-server/package-lock.json
            web-cockpit/package-lock.json
            cli/package-lock.json
            pi-adapter/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Build core binary for TypeScript integration suites
        run: cargo build

      - name: Build generated TypeScript contracts
        working-directory: contracts/ts
        run: npm ci && npm run build

      - name: Install web server dependencies
        working-directory: web-server
        run: npm ci

      - name: Install web cockpit dependencies
        working-directory: web-cockpit
        run: npm ci

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Install Pi adapter dependencies
        working-directory: pi-adapter
        run: npm ci

      - name: Test web server
        working-directory: web-server
        run: npm test

      - name: Test web server against core
        working-directory: web-server
        run: npm run test:core-smoke

      - name: Test web cockpit
        working-directory: web-cockpit
        run: npm test

      - name: Test CLI
        working-directory: cli
        run: npm test

      - name: Test CLI against core
        working-directory: cli
        run: npm run test:core-smoke

      - name: Test Pi adapter
        working-directory: pi-adapter
        run: npm test
