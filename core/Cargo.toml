[package]
name = "patchbay-core"
version = "0.2.0"
edition = "2021"

[dependencies]
patchbay-contracts = { path = "../contracts/rust" }
async-trait = "0.1"
base64 = "0.22"
scrypt = "0.11"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }
rusqlite = { version = "0.31", features = ["bundled"] }
prost = "0.14"
prost-types = "0.14"
thiserror = "2"
tracing = "0.1"
tempfile = "3"

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "test-util"] }
patchbay-test-support = { path = "../patchbay-test-support" }
