version: v2
clean: true
plugins:
  - local: protoc-gen-prost
    out: rust/src/gen
    opt:
      - type_attribute=.patchbay.ObservationRequest.observation=#[allow(clippy::large_enum_variant)]
      - type_attribute=.patchbay.DiagnosticsQuery.query=#[allow(clippy::large_enum_variant)]
      - type_attribute=.patchbay.QueryDiagnosticsResponse.result=#[allow(clippy::large_enum_variant)]
      - type_attribute=.patchbay.DiagnosticsResult.result=#[allow(clippy::large_enum_variant)]
  - local: ./ts/node_modules/.bin/protoc-gen-es
    out: ts/src/gen
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: proto
