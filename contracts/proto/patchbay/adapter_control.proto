syntax = "proto3";

package patchbay;

import "google/protobuf/timestamp.proto";
import "patchbay/adapter.proto";
import "patchbay/common.proto";
import "patchbay/observations.proto";
import "patchbay/operations.proto";
import "patchbay/resources.proto";
import "patchbay/sessions.proto";

// The adapter-facing service. Adapters are clients of the authoritative core
// and authenticate with adapter-specific attachment evidence rather than the
// control-surface principal secret.
service AdapterControlService {
  rpc Attach(AttachRequest) returns (AttachResult);
  rpc IngestObservation(ObservationRequest) returns (ObservationResult);
  rpc ReportDiagnostics(AdapterDiagnosticReport) returns (AdapterDiagnosticReportResult);
  rpc ReceiveDeliveries(ReceiveRequest) returns (stream Delivery);
}

message AttachRequest {
  AdapterRegistration registration = 1;
  bytes attachment_evidence = 2;
}

message AttachResult {
  bool accepted = 1;
  EventId attach_event_id = 2;
  string failure_code = 3;
}

message ObservationRequest {
  AuthorityDomainId authority_domain_id = 1;
  oneof observation {
    SessionReport session_report = 2;
    Observation event = 3;
    ResourceReport resource_report = 4;
  }
}

message ObservationResult {
  EventId event_id = 1;
}

message AdapterDiagnosticReport {
  AuthorityDomainId authority_domain_id = 1;
  TargetScope target_scope = 2;
  repeated TypedCorrelation correlations = 3;
  google.protobuf.Timestamp observed_at = 4;
  FailureCode failure_code = 5;
  PayloadEnvelope payload = 6;
}

message AdapterDiagnosticReportResult {
  bool accepted = 1;
  EventId observation_event_id = 2;
  EventId audit_event_id = 3;
  FailureCode failure_code = 4;
}

message ReceiveRequest {
  AdapterId adapter_id = 1;
  Lsn cursor = 2;
}

message Delivery {
  Operation operation = 1;
  EventId delivery_event_id = 2;
}
