syntax = "proto3";

package patchbay;

import "google/protobuf/timestamp.proto";
import "patchbay/adapter.proto";
import "patchbay/common.proto";
import "patchbay/observations.proto";
import "patchbay/operations.proto";
import "patchbay/resources.proto";
import "patchbay/sessions.proto";

// The adapter-facing service. Adapters are clients of the authoritative core
// and authenticate with adapter-specific attachment evidence rather than the
// control-surface principal secret.
service AdapterControlService {
  rpc Attach(AttachRequest) returns (AttachResult);
  rpc IngestObservation(ObservationRequest) returns (ObservationResult);
  rpc ReportDiagnostics(AdapterDiagnosticReport) returns (AdapterDiagnosticReportResult);
  rpc ReceiveDeliveries(ReceiveRequest) returns (stream Delivery);
}

message AttachRequest {
  AdapterRegistration registration = 1;
  bytes attachment_evidence = 2;
}

message AttachResult {
  bool accepted = 1;
  EventId attach_event_id = 2;
  string failure_code = 3;
}

message ObservationRequest {
  AuthorityDomainId authority_domain_id = 1;
  oneof observation {
    SessionReport session_report = 2;
    Observation event = 3;
    ResourceReport resource_report = 4;
    SpawnExecutionEvidence spawn_execution_evidence = 5;
  }
}

// Exact orchestration phase at the last durable spawn-execution observation.
// No phase is a catch-all liveness assertion: each phase has a closed set of
// compatible external-effect dispositions validated by the core.
enum SpawnExecutionPhase {
  SPAWN_EXECUTION_PHASE_UNSPECIFIED = 0;
  SPAWN_EXECUTION_PHASE_ACCEPTED_NOT_OFFERED = 1;
  SPAWN_EXECUTION_PHASE_OFFERED = 2;
  SPAWN_EXECUTION_PHASE_QUIESCING_PRIOR = 3;
  SPAWN_EXECUTION_PHASE_PRIOR_TERMINATED = 4;
  SPAWN_EXECUTION_PHASE_LAUNCH_ATTEMPTED = 5;
  SPAWN_EXECUTION_PHASE_EXTERNAL_IDENTITY_KNOWN = 6;
  SPAWN_EXECUTION_PHASE_HANDSHAKE_RECONCILING = 7;
  SPAWN_EXECUTION_PHASE_SUCCESS_EVIDENCE_REPORTED = 8;
}

enum ExternalEffectDisposition {
  EXTERNAL_EFFECT_DISPOSITION_UNSPECIFIED = 0;
  EXTERNAL_EFFECT_DISPOSITION_PROVED_NONE = 1;
  EXTERNAL_EFFECT_DISPOSITION_MAY_EXIST = 2;
  EXTERNAL_EFFECT_DISPOSITION_IDENTIFIED = 3;
}

// Producer authority is explicit so an authenticated adapter cannot
// manufacture the core-only never-offered terminal decision.
enum SpawnExecutionEvidenceProducer {
  SPAWN_EXECUTION_EVIDENCE_PRODUCER_UNSPECIFIED = 0;
  SPAWN_EXECUTION_EVIDENCE_PRODUCER_CORE = 1;
  SPAWN_EXECUTION_EVIDENCE_PRODUCER_CURRENT_ADAPTER = 2;
}

// Durable attachment provenance for replay validation. The process-local
// attachment token is deliberately not persisted.
message SpawnEvidenceAttachment {
  AdapterId adapter_id = 1;
  Generation adapter_generation = 2;
  EventId attachment_event_id = 3;
}

// The only durable evidence family that may release or poison an accepted
// spawn claim. `exact_claim` prevents cross-command/claim reuse. Silence and
// absence of a delivered acknowledgement have no representation here.
message SpawnExecutionEvidence {
  AuthorityDomainId authority_domain_id = 1;
  SpawnGenerationClaim exact_claim = 2;
  SpawnExecutionPhase phase = 3;
  ExternalEffectDisposition external_effect_disposition = 4;
  SpawnExecutionEvidenceProducer producer = 5;
  SpawnEvidenceAttachment source_attachment = 6;
  FailureCode failure_code = 7;
  // Present only for PROVED_NONE and restricted to the closed proof oneof.
  NoExternalEffectProof no_external_effect_proof = 8;
  // Optional for MAY_EXIST and required for IDENTIFIED. When present it must
  // be the exact claimed logical target/generation and current adapter.
  RuntimeGenerationRef external_runtime = 9;
}

message ObservationResult {
  EventId event_id = 1;
}

message AdapterDiagnosticReport {
  AuthorityDomainId authority_domain_id = 1;
  TargetScope target_scope = 2;
  repeated TypedCorrelation correlations = 3;
  google.protobuf.Timestamp observed_at = 4;
  FailureCode failure_code = 5;
  PayloadEnvelope payload = 6;
}

message AdapterDiagnosticReportResult {
  bool accepted = 1;
  EventId observation_event_id = 2;
  EventId audit_event_id = 3;
  FailureCode failure_code = 4;
}

message ReceiveRequest {
  AdapterId adapter_id = 1;
  Lsn cursor = 2;
}

message Delivery {
  // Ordinary accepted work carries the accepted Operation. Managed spawn also
  // keeps this compatibility view, but adapters must authorize and execute it
  // from accepted_spawn, the exact durable acceptance envelope.
  Operation operation = 1;
  EventId delivery_event_id = 2;
  SpawnClaimAccepted accepted_spawn = 3;
  // Authority-bearing notification emitted only after the core's atomic
  // promotion transaction. It lets the owning adapter release its local
  // successor quarantine without inferring promotion from Result success.
  SpawnPromotionCommitted promotion_committed = 4;
}
