syntax = "proto3";

package patchbay;

import "patchbay/admin.proto";
import "patchbay/common.proto";
import "patchbay/diagnostics.proto";
import "patchbay/operations.proto";

// The internal control-plane service the TS web server speaks to the Rust
// core over gRPC/HTTP2. Browser-facing surfaces are a subset reachable
// through the web server; control-surface methods are principal-gated.
service ControlService {
  rpc Submit(SubmitRequest) returns (SubmissionResult);
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeEvent);
  rpc LoadSnapshot(LoadSnapshotRequest) returns (LoadSnapshotResponse);
  // Password verification stays in the core so password hashes never cross
  // from the durable operator record to a control surface.
  rpc VerifyOperatorPassword(VerifyOperatorPasswordRequest) returns (VerifyOperatorPasswordResult);
  // Revocation is authorized by, and applies to, the verified current session.
  rpc RevokeOperatorSession(RevokeOperatorSessionRequest) returns (RevokeOperatorSessionResult);
  // An already verified compound issuer may enroll another endpoint.
  rpc EnrollControlSurfacePrincipal(EnrollControlSurfacePrincipalRequest) returns (EnrollControlSurfacePrincipalResult);
  rpc QueryDiagnostics(QueryDiagnosticsRequest) returns (QueryDiagnosticsResponse);
}

message SubmitRequest {
  patchbay.Operation operation = 1;
}

message SubscribeRequest {
  patchbay.AuthorityDomainId authority_domain_id = 1;
  patchbay.Lsn cursor = 2;
}

message SubscribeEvent {
  patchbay.EventId event_id = 1;
  patchbay.StoredEventPayload payload = 2;
}

message LoadSnapshotRequest {
  patchbay.AuthorityDomainId authority_domain_id = 1;
  optional patchbay.Lsn at_or_before = 2;
}

message LoadSnapshotResponse {
  bool present = 1;
  patchbay.EventId event_id = 2;
  bytes snapshot_payload = 3;
}

message VerifyOperatorPasswordRequest {
  patchbay.ActorId operator_actor_id = 1;
  string password = 2;
  patchbay.PrincipalEnrollment principal = 3;
}

message VerifyOperatorPasswordResult {
  patchbay.OperatorSessionId operator_session_id = 1;
  patchbay.PrincipalCredential principal = 2;
}

message RevokeOperatorSessionRequest {}

message RevokeOperatorSessionResult {
  bool revoked = 1;
}

message EnrollControlSurfacePrincipalRequest {
  patchbay.PrincipalEnrollment principal = 1;
}

message EnrollControlSurfacePrincipalResult {
  patchbay.PrincipalCredential principal = 1;
}
