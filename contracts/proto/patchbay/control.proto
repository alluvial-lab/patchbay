syntax = "proto3";

package patchbay;

import "patchbay/admin.proto";
import "patchbay/authority.proto";
import "patchbay/common.proto";
import "patchbay/diagnostics.proto";
import "patchbay/operations.proto";
import "patchbay/security.proto";

// The internal control-plane service the TS web server speaks to the Rust
// core over gRPC/HTTP2. Browser-facing surfaces are a subset reachable
// through the web server; control-surface methods are principal-gated.
service ControlService {
  rpc Submit(SubmitRequest) returns (SubmissionResult);
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeEvent);
  rpc LoadSnapshot(LoadSnapshotRequest) returns (LoadSnapshotResponse);
  // Password verification stays in the core so password hashes never cross
  // from the durable operator record to a control surface.
  rpc VerifyOperatorPassword(VerifyOperatorPasswordRequest) returns (VerifyOperatorPasswordResult);
  // Revocation is authorized by, and applies to, the verified current session.
  rpc RevokeOperatorSession(RevokeOperatorSessionRequest) returns (RevokeOperatorSessionResult);
  rpc RevokeAllOperatorSessions(RevokeAllOperatorSessionsRequest) returns (RevokeAllOperatorSessionsResult);
  rpc RevokeControlSurfacePrincipal(RevokeControlSurfacePrincipalRequest) returns (RevokeControlSurfaceResult);
  rpc RevokeControlSurfaceEndpoint(RevokeControlSurfaceEndpointRequest) returns (RevokeControlSurfaceResult);
  // Self-scoped grant attenuation. The request never carries issuer identity;
  // the compound issuer is verified from transport metadata.
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResult);
  rpc EnterSecurityLockdown(EnterSecurityLockdownRequest) returns (EnterSecurityLockdownResult);
  rpc LoadSecuritySnapshot(LoadSecuritySnapshotRequest) returns (LoadSecuritySnapshotResponse);
  // An already verified compound issuer may enroll another endpoint.
  rpc EnrollControlSurfacePrincipal(EnrollControlSurfacePrincipalRequest) returns (EnrollControlSurfacePrincipalResult);
  rpc QueryDiagnostics(QueryDiagnosticsRequest) returns (QueryDiagnosticsResponse);
  // The web/control-surface boundary submits only a bounded integrity outcome;
  // the core replaces attribution and time from the verified compound issuer.
  rpc RecordControlSurfaceAudit(RecordControlSurfaceAuditRequest) returns (RecordControlSurfaceAuditResponse);
}

message SubmitRequest {
  patchbay.Operation operation = 1;
}

message SubscribeRequest {
  patchbay.AuthorityDomainId authority_domain_id = 1;
  patchbay.Lsn cursor = 2;
}

message SubscribeEvent {
  patchbay.EventId event_id = 1;
  patchbay.StoredEventPayload payload = 2;
}

enum SnapshotViewKind {
  SNAPSHOT_VIEW_KIND_UNSPECIFIED = 0;
  SNAPSHOT_VIEW_KIND_SESSION = 1;
  SNAPSHOT_VIEW_KIND_RESOURCE = 2;
}

message LoadSnapshotRequest {
  patchbay.AuthorityDomainId authority_domain_id = 1;
  optional patchbay.Lsn at_or_before = 2;
  SnapshotViewKind view_kind = 3;
}

message LoadSnapshotResponse {
  bool present = 1;
  patchbay.EventId event_id = 2;
  bytes snapshot_payload = 3;
  SnapshotViewKind view_kind = 4;
}

message VerifyOperatorPasswordRequest {
  patchbay.ActorId operator_actor_id = 1;
  string password = 2;
  patchbay.PrincipalEnrollment principal = 3;
}

message VerifyOperatorPasswordResult {
  patchbay.OperatorSessionId operator_session_id = 1;
  patchbay.PrincipalCredential principal = 2;
  patchbay.Generation operator_session_generation = 3;
}

message RevokeOperatorSessionRequest {}

message RevokeOperatorSessionResult {
  bool revoked = 1;
}

message RevokeAllOperatorSessionsRequest {
  string reason_code = 1;
}

message RevokeAllOperatorSessionsResult {
  uint32 revoked_session_count = 1;
  patchbay.Generation invalidated_through_generation = 2;
  patchbay.EventId revocation_event_id = 3;
}

message RevokeControlSurfacePrincipalRequest {
  string principal_id = 1;
  string reason_code = 2;
}

message RevokeControlSurfaceEndpointRequest {
  oneof target {
    patchbay.EndpointId endpoint_id = 1;
    patchbay.DeviceId device_id = 2;
  }
  string reason_code = 3;
}

message RevokeControlSurfaceResult {
  bool newly_revoked = 1;
  uint32 revoked_principal_count = 2;
  uint32 revoked_session_count = 3;
  patchbay.EventId revocation_event_id = 4;
}

message RevokeGrantRequest {
  AuthorityDomainId authority_domain_id = 1;
  GrantId grant_id = 2;
  string reason = 3;
}

message RevokeGrantResult {
  bool changed = 1;
  bool already_revoked = 2;
  EventId revocation_event_id = 3;
  GrantRevocationPolicy applied_policy = 4;
  repeated GrantRevocationEffect command_effects = 5;
}

message EnterSecurityLockdownRequest {
  AuthorityDomainId authority_domain_id = 1;
  string reason_code = 2;
}

message EnterSecurityLockdownResult {
  SecurityLockdownState lockdown = 1;
  EventId lockdown_event_id = 2;
  bool already_active = 3;
  uint32 affected_runtime_session_count = 4;
  Generation invalidated_through_operator_session_generation = 5;
}

message LoadSecuritySnapshotRequest {
  AuthorityDomainId authority_domain_id = 1;
}

message LoadSecuritySnapshotResponse {
  SecuritySnapshot snapshot = 1;
}

message EnrollControlSurfacePrincipalRequest {
  patchbay.PrincipalEnrollment principal = 1;
}

message EnrollControlSurfacePrincipalResult {
  patchbay.PrincipalCredential principal = 1;
}

message RecordControlSurfaceAuditRequest {
  patchbay.AuditEventKind kind = 1;
  string reason_code = 2;
}

message RecordControlSurfaceAuditResponse {
  patchbay.EventId audit_event_id = 1;
}
