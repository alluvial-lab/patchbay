syntax = "proto3";

package patchbay;

import "google/protobuf/timestamp.proto";
import "patchbay/common.proto";
import "patchbay/security.proto";

message Session {
  AuthorityDomainId authority_domain_id = 1;
  AdapterId adapter_id = 2;
  string deployment_scope = 3;
  RuntimeSessionId runtime_session_id = 4;
  Generation session_generation = 5;
  string project = 6;
  string cwd = 7;
  string name = 8;
  SessionState state = 9;
  Lsn last_authoritative_lsn = 10;
  google.protobuf.Timestamp observed_at = 11;
  bool tombstoned = 12;
  Lsn superseded_at_lsn = 13;
  // Current adapter-reported opaque provider/model id; empty means unavailable.
  string model = 14;
  // Last accepted adapter-side report order, distinct from core LSN order.
  SessionReportSourceCursor last_source_cursor = 15;
}

message SessionState {
  SessionConnectivityState connectivity = 1;
  SessionActivityState activity = 2;
}

enum SessionConnectivityState {
  SESSION_CONNECTIVITY_STATE_UNSPECIFIED = 0;
  SESSION_CONNECTIVITY_STATE_LIVE = 1;
  SESSION_CONNECTIVITY_STATE_STALE = 2;
  SESSION_CONNECTIVITY_STATE_OFFLINE = 3;
  SESSION_CONNECTIVITY_STATE_UNKNOWN = 4;
  SESSION_CONNECTIVITY_STATE_FAILED = 5;
}

enum SessionActivityState {
  SESSION_ACTIVITY_STATE_UNSPECIFIED = 0;
  SESSION_ACTIVITY_STATE_IDLE = 1;
  SESSION_ACTIVITY_STATE_WORKING = 2;
  SESSION_ACTIVITY_STATE_UNKNOWN = 3;
}

// Adapter-side order for full session reports. Revision is positive and
// strictly increasing within one authenticated adapter generation and runtime
// session generation. Core LSN remains the durable arrival/commit order.
message SessionReportSourceCursor {
  Generation adapter_generation = 1;
  uint64 revision = 2;
}

// One adapter-reported snapshot of every report-carried session field.
// Adapter ingress authenticates adapter_id and source_cursor before durability.
message SessionReport {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation session_generation = 4;
  SessionConnectivityState connectivity = 5;
  SessionActivityState activity = 6;
  string project = 7;
  string cwd = 8;
  string name = 9;
  TypedCorrelation spawn_origin = 10;
  string model = 11;
  SessionReportSourceCursor source_cursor = 12;
}

message SessionSnapshot {
  AuthorityDomainId authority_domain_id = 1;
  Lsn snapshot_lsn = 2;
  Generation core_generation = 3;
  repeated Session sessions = 4;
  repeated ViewRevision view_revisions = 5;
  google.protobuf.Timestamp materialized_at = 6;
  SecurityLockdownState lockdown = 7;
}

// Private persisted recovery payload. LoadSnapshot returns only `snapshot`;
// tombstones remain projection-owned checkpoint state.
message StoredSessionCheckpoint {
  SessionSnapshot snapshot = 1;
  repeated SessionCheckpointTombstone tombstones = 2;
}

message SessionCheckpointTombstone {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation generation = 4;
  Lsn superseded_at_lsn = 5;
}

message ViewRevision {
  TargetScope target_scope = 1;
  Lsn revision_lsn = 2;
}

// A durable session-state delta event. One event per mutation kind. The payload
// for StoredEventKind::SessionState. The core writes these; the SessionRegistry
// projection folds them into in-memory state. Mirrors acceptance's CommandTransition.
message SessionStateEvent {
  AuthorityDomainId authority_domain_id = 1;
  oneof mutation {
    SessionRegistered registered = 2;
    SessionGenerationBumped generation_bumped = 3;
    SessionConnectivityChanged connectivity_changed = 4;
    SessionActivityChanged activity_changed = 5;
    SessionRelabeled relabeled = 6;
    SessionModelChanged model_changed = 7;
    SessionReportApplied report_applied = 8;
  }
}

message SessionRegistered {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation session_generation = 4;
  SessionState initial_state = 5;
  string project = 6;
  string cwd = 7;
  string name = 8;
  // Optional: the spawn Operation that created this session. Set when the
  // adapter reports a session resulting from a spawn. Lets the authority
  // descendant-grant reactor correlate the session to its spawn command.
  TypedCorrelation spawn_origin = 9;
  string model = 10;
  // Absent only in legacy durable events written before source ordering.
  SessionReportSourceCursor source_cursor = 11;
}

message SessionGenerationBumped {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation from_generation = 4;
  // The prior generation is tombstoned at this event's LSN. The tombstone
  // fact (generation N existed, superseded at LSN X) is retained indefinitely.
  Generation to_generation = 5;
  SessionState initial_state = 6;
  string project = 7;
  string cwd = 8;
  string name = 9;
  string model = 10;
  // Optional: the spawn Operation that produced the replacement generation.
  // Tag 11 follows the independently-added model field at tag 10; tags remain
  // unique and existing wire identities are unchanged.
  TypedCorrelation spawn_origin = 11;
  // Absent only in legacy durable events written before source ordering.
  SessionReportSourceCursor source_cursor = 12;
}

// Atomic equal-runtime-generation application of one complete adapter report.
// The prior cursor makes replay validate the exact projected pre-state.
message SessionReportApplied {
  SessionReport report = 1;
  // Absent only when the projected generation has no legacy source watermark.
  SessionReportSourceCursor previous_source_cursor = 2;
}

message SessionConnectivityChanged {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation session_generation = 4;
  SessionConnectivityState from = 5;
  SessionConnectivityState to = 6;
}

message SessionActivityChanged {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation session_generation = 4;
  SessionActivityState from = 5;
  SessionActivityState to = 6;
}

message SessionRelabeled {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation session_generation = 4;
  string project = 5;
  string cwd = 6;
  string name = 7;
}

message SessionModelChanged {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation session_generation = 4;
  string from = 5;
  string to = 6;
}
