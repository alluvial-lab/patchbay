syntax = "proto3";

package patchbay;

import "google/protobuf/timestamp.proto";
import "patchbay/authority.proto";
import "patchbay/common.proto";
import "patchbay/operations.proto";
import "patchbay/security.proto";

message Session {
  AuthorityDomainId authority_domain_id = 1;
  AdapterId adapter_id = 2;
  string deployment_scope = 3;
  RuntimeSessionId runtime_session_id = 4;
  Generation session_generation = 5;
  string project = 6;
  string cwd = 7;
  string name = 8;
  SessionState state = 9;
  Lsn last_authoritative_lsn = 10;
  google.protobuf.Timestamp observed_at = 11;
  bool tombstoned = 12;
  Lsn superseded_at_lsn = 13;
  // Current adapter-reported opaque provider/model id; empty means unavailable.
  string model = 14;
  // Last accepted adapter-side report order, distinct from core LSN order.
  SessionReportSourceCursor last_source_cursor = 15;
}

message SessionState {
  SessionConnectivityState connectivity = 1;
  SessionActivityState activity = 2;
}

enum SessionConnectivityState {
  SESSION_CONNECTIVITY_STATE_UNSPECIFIED = 0;
  SESSION_CONNECTIVITY_STATE_LIVE = 1;
  SESSION_CONNECTIVITY_STATE_STALE = 2;
  SESSION_CONNECTIVITY_STATE_OFFLINE = 3;
  SESSION_CONNECTIVITY_STATE_UNKNOWN = 4;
  SESSION_CONNECTIVITY_STATE_FAILED = 5;
}

enum SessionActivityState {
  SESSION_ACTIVITY_STATE_UNSPECIFIED = 0;
  SESSION_ACTIVITY_STATE_IDLE = 1;
  SESSION_ACTIVITY_STATE_WORKING = 2;
  SESSION_ACTIVITY_STATE_UNKNOWN = 3;
}

// Adapter-side order for full session reports. Revision is positive and
// strictly increasing within one authenticated adapter generation and runtime
// session generation. Core LSN remains the durable arrival/commit order.
message SessionReportSourceCursor {
  Generation adapter_generation = 1;
  uint64 revision = 2;
}

// One adapter-reported snapshot of every report-carried session field.
// Adapter ingress authenticates adapter_id and source_cursor before durability.
message SessionReport {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation session_generation = 4;
  SessionConnectivityState connectivity = 5;
  SessionActivityState activity = 6;
  string project = 7;
  string cwd = 8;
  string name = 9;
  TypedCorrelation spawn_origin = 10;
  string model = 11;
  SessionReportSourceCursor source_cursor = 12;
}

// Shared runtime-generation fence result. ClaimedSuccessor is deliberately a
// typed variant rather than a SessionReport exception: every ingress family
// uses this same classifier and only the exact claimed report may stage.
message RuntimeGenerationDisposition {
  oneof disposition {
    RuntimeGenerationCurrent current = 1;
    RuntimeGenerationClaimedSuccessor claimed_successor = 2;
    RuntimeGenerationTombstoned tombstoned = 3;
    RuntimeGenerationUnknown unknown = 4;
    RuntimeGenerationIdentityMismatch identity_mismatch = 5;
  }
}

message RuntimeGenerationCurrent {}

message RuntimeGenerationClaimedSuccessor {
  CommandId claim_operation_id = 1;
  RuntimeGenerationRef expected_prior = 2;
  Generation claimed_generation = 3;
}

message RuntimeGenerationTombstoned {
  Lsn superseded_at_lsn = 1;
}

message RuntimeGenerationUnknown {}
message RuntimeGenerationIdentityMismatch {}

// Durable source binding for staged and quarantined runtime evidence. The
// process-local attachment token is intentionally absent.
message RuntimeEvidenceSourceAttachment {
  AdapterId adapter_id = 1;
  Generation adapter_generation = 2;
  EventId attachment_event_id = 3;
}

// Exact successor report admitted by ClaimedSuccessor. Folding this event may
// reserve the external identity, but must not create a current/live session.
message SpawnSuccessorEvidenceStaged {
  AuthorityDomainId authority_domain_id = 1;
  SpawnGenerationClaim exact_claim = 2;
  SessionReport report = 3;
  RuntimeGenerationRef classified_target = 4;
  RuntimeGenerationDisposition disposition = 5;
  RuntimeEvidenceSourceAttachment source_attachment = 6;
  ExternalRuntimeRef external_runtime_reservation = 7;
}

message SpawnPromotionLifecycleEvidence {
  EventId event_id = 1;
  CommandTransition transition = 2;
}

message SpawnPromotionResultEvidence {
  EventId event_id = 1;
  CommandId command_id = 2;
  TargetScope target_scope = 3;
  FailureCode failure_code = 4;
  google.protobuf.Timestamp observed_at = 5;
}

message SpawnPromotionStagedEvidence {
  EventId event_id = 1;
  SpawnSuccessorEvidenceStaged staged = 2;
}

// One semantic replay decision shared by authority, session, claim, and
// command projections. Storage assigns promotion_event_id and
// completion_audit_event_id together and stamps the nested descendant audit
// link in the same transaction. The event is self-contained; references bind
// its facts to the preceding durable prefix rather than requiring another
// post-promotion source event.
message SpawnPromotionCommitted {
  AuthorityDomainId authority_domain_id = 1;
  EventId promotion_event_id = 2;
  EventId completion_audit_event_id = 3;
  EventId accepted_claim_event_id = 4;
  SpawnClaimAccepted accepted_claim = 5;
  repeated SpawnPromotionLifecycleEvidence lifecycle = 6;
  SpawnPromotionResultEvidence successful_result = 7;
  SpawnPromotionStagedEvidence staged_successor = 8;
  RuntimeGenerationRef promoted_runtime = 9;
  ExternalRuntimeRef external_runtime_reservation = 10;
  SpawnPromotionAuthorityEvidence authority = 11;
  google.protobuf.Timestamp committed_at = 12;
}

message SessionSnapshot {
  AuthorityDomainId authority_domain_id = 1;
  Lsn snapshot_lsn = 2;
  Generation core_generation = 3;
  repeated Session sessions = 4;
  repeated ViewRevision view_revisions = 5;
  google.protobuf.Timestamp materialized_at = 6;
  SecurityLockdownState lockdown = 7;
}

// Private persisted recovery payload. LoadSnapshot returns only `snapshot`;
// tombstones remain projection-owned checkpoint state.
message StoredSessionCheckpoint {
  SessionSnapshot snapshot = 1;
  repeated SessionCheckpointTombstone tombstones = 2;
  repeated LogicalTargetProjectionRecord logical_targets = 3;
}

// Claim lifecycle is independent from CommandState. In particular, failed,
// cancelled, expired, and other terminal command states never imply release.
enum SpawnClaimDisposition {
  SPAWN_CLAIM_DISPOSITION_UNSPECIFIED = 0;
  SPAWN_CLAIM_DISPOSITION_ACTIVE = 1;
  SPAWN_CLAIM_DISPOSITION_RELEASED_NO_EXTERNAL_EFFECT = 2;
  SPAWN_CLAIM_DISPOSITION_POISONED_PENDING_RECONCILIATION = 3;
  SPAWN_CLAIM_DISPOSITION_PROMOTED = 4;
  SPAWN_CLAIM_DISPOSITION_TARGET_ABANDONED = 5;
}

// Closed proof vocabulary. It is carried by the referenced typed
// SpawnExecutionEvidence event; absence of a delivered acknowledgement is
// deliberately not a proof variant.
message NoExternalEffectProof {
  oneof proof {
    CorePreDeliveryTerminalProof core_pre_delivery_terminal = 1;
    AdapterRefusalBeforeDeliveryProof authenticated_adapter_refusal_before_delivery = 2;
    SupervisorPreLaunchFailureProof exact_supervisor_pre_launch_failure = 3;
  }
}

// Exact durable core decision that terminalized the claim command while it was
// still accepted and before any delivery offer. Replay validates the referenced
// CommandTransition, including command identity, terminal outcome, and ordering.
message CorePreDeliveryTerminalProof {
  EventId terminal_decision_event_id = 1;
}

message AdapterRefusalBeforeDeliveryProof {
  AdapterId adapter_id = 1;
  Generation adapter_generation = 2;
}

message SupervisorPreLaunchFailureProof {
  AdapterId adapter_id = 1;
  Generation adapter_generation = 2;
}

message SpawnClaimNoEffectRelease {
  EventId evidence_event_id = 1;
  // Required for continuation release: exact prior-N liveness must be durably
  // re-established before the pending-replacement fence can clear.
  RuntimeGenerationRef exact_prior_liveness = 2;
  EventId prior_liveness_event_id = 3;
}

message SpawnClaimAmbiguityEvidence {
  EventId evidence_event_id = 1;
}

message SpawnClaimPromotionEvidence {
  EventId promotion_event_id = 1;
  RuntimeGenerationRef promoted_runtime = 2;
}

message SpawnClaimAbandonmentEvidence {
  EventId abandonment_event_id = 1;
}

// One durable accepted spawn/continuation decision. The continuation's claim,
// compound authority, exact-N fence, and complete already-accepted-work
// effects are one replay unit and therefore cannot race each other.
message SpawnClaimAccepted {
  AcceptedOperation accepted_operation = 1;
  SpawnGenerationClaim claim = 2;
  ContinuationAuthorityProvenance compound_authority = 3;
  SpawnPendingReplacementFence pending_replacement = 4;
  repeated SpawnPriorWorkEffect prior_work_effects = 5;
}

message SpawnClaimDispositionChanged {
  CommandId claim_operation_id = 1;
  SpawnClaimDisposition from_disposition = 2;
  SpawnClaimDisposition to_disposition = 3;
  oneof evidence {
    SpawnClaimNoEffectRelease no_external_effect_release = 4;
    SpawnClaimAmbiguityEvidence ambiguous_external_effect = 5;
    SpawnClaimPromotionEvidence promotion = 6;
    SpawnClaimAbandonmentEvidence target_abandonment = 7;
  }
}

message SpawnClaimEvent {
  AuthorityDomainId authority_domain_id = 1;
  oneof mutation {
    SpawnClaimAccepted accepted = 2;
    SpawnClaimDispositionChanged disposition_changed = 3;
  }
}

// Untrusted private claim-projection checkpoint serialization. v0.1.0 recovery
// does not install this shape: it rebuilds from the complete durable log. A
// future loader must validate continuity epoch, exact storage-row anchor, and
// durable prefix/tail semantics before any field below may affect projection.
message SpawnClaimCheckpoint {
  AuthorityDomainId authority_domain_id = 1;
  Lsn snapshot_lsn = 2;
  repeated SpawnClaimCheckpointRecord records = 3;
}

message SpawnClaimCheckpointRecord {
  SpawnGenerationClaim claim = 1;
  Lsn accepted_lsn = 2;
  ContinuationAuthorityProvenance compound_authority = 3;
  // Cached projection data only; never disposition authority without replayed
  // durable transition evidence from the anchored log prefix.
  SpawnClaimDisposition disposition = 4;
  RuntimeGenerationRef pending_replacement = 5;
  repeated SpawnPriorWorkEffect prior_work_effects = 6;
}

// Private logical-target projection state. Project/cwd/name/model are absent
// because mutable presentation metadata is never logical or external identity.
message LogicalTargetProjectionRecord {
  LogicalTargetId logical_target_id = 1;
  AdapterId adapter_id = 2;
  string deployment_scope = 3;
  RuntimeGenerationRef current = 4;
  ExternalRuntimeRef reserved_candidate = 5;
  repeated LogicalTargetTombstone tombstones = 6;
}

message LogicalTargetTombstone {
  ExternalRuntimeRef external_runtime_ref = 1;
  Lsn superseded_at_lsn = 2;
}

message SessionCheckpointTombstone {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation generation = 4;
  Lsn superseded_at_lsn = 5;
}

message ViewRevision {
  TargetScope target_scope = 1;
  Lsn revision_lsn = 2;
}

// A durable session-state delta event. One event per mutation kind. The payload
// for StoredEventKind::SessionState. The core writes these; the SessionRegistry
// projection folds them into in-memory state. Mirrors acceptance's CommandTransition.
message SessionStateEvent {
  AuthorityDomainId authority_domain_id = 1;
  oneof mutation {
    SessionRegistered registered = 2;
    SessionGenerationBumped generation_bumped = 3;
    SessionConnectivityChanged connectivity_changed = 4;
    SessionActivityChanged activity_changed = 5;
    SessionRelabeled relabeled = 6;
    SessionModelChanged model_changed = 7;
    SessionReportApplied report_applied = 8;
    LogicalTargetCreated logical_target_created = 9;
    LogicalTargetInitialCurrentAssigned logical_target_initial_current_assigned = 10;
    LogicalTargetCandidateReserved logical_target_candidate_reserved = 11;
    LogicalTargetCandidateReleased logical_target_candidate_released = 12;
  }
}

// Identity-only logical-target mutations. They carry no Operation, claim,
// evidence, or authority payload. Later lifecycle envelopes consume the same
// projection methods rather than redefining identity.
message LogicalTargetCreated {
  LogicalTargetId logical_target_id = 1;
  AdapterId adapter_id = 2;
  string deployment_scope = 3;
}

message LogicalTargetInitialCurrentAssigned {
  LogicalTargetId logical_target_id = 1;
  ExternalRuntimeRef external_runtime_ref = 2;
}

message LogicalTargetCandidateReserved {
  LogicalTargetId logical_target_id = 1;
  ExternalRuntimeRef external_runtime_ref = 2;
}

message LogicalTargetCandidateReleased {
  LogicalTargetId logical_target_id = 1;
  ExternalRuntimeRef external_runtime_ref = 2;
}

message SessionRegistered {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation session_generation = 4;
  SessionState initial_state = 5;
  string project = 6;
  string cwd = 7;
  string name = 8;
  // Optional: the spawn Operation that created this session. Set when the
  // adapter reports a session resulting from a spawn. Lets the authority
  // descendant-grant reactor correlate the session to its spawn command.
  TypedCorrelation spawn_origin = 9;
  string model = 10;
  // Absent only in legacy durable events written before source ordering.
  SessionReportSourceCursor source_cursor = 11;
}

message SessionGenerationBumped {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation from_generation = 4;
  // The prior generation is tombstoned at this event's LSN. The tombstone
  // fact (generation N existed, superseded at LSN X) is retained indefinitely.
  Generation to_generation = 5;
  SessionState initial_state = 6;
  string project = 7;
  string cwd = 8;
  string name = 9;
  string model = 10;
  // Optional: the spawn Operation that produced the replacement generation.
  // Tag 11 follows the independently-added model field at tag 10; tags remain
  // unique and existing wire identities are unchanged.
  TypedCorrelation spawn_origin = 11;
  // Absent only in legacy durable events written before source ordering.
  SessionReportSourceCursor source_cursor = 12;
}

// Atomic equal-runtime-generation application of one complete adapter report.
// The prior cursor makes replay validate the exact projected pre-state.
message SessionReportApplied {
  SessionReport report = 1;
  // Absent only when the projected generation has no legacy source watermark.
  SessionReportSourceCursor previous_source_cursor = 2;
}

message SessionConnectivityChanged {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation session_generation = 4;
  SessionConnectivityState from = 5;
  SessionConnectivityState to = 6;
}

message SessionActivityChanged {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation session_generation = 4;
  SessionActivityState from = 5;
  SessionActivityState to = 6;
}

message SessionRelabeled {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation session_generation = 4;
  string project = 5;
  string cwd = 6;
  string name = 7;
}

message SessionModelChanged {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation session_generation = 4;
  string from = 5;
  string to = 6;
}
