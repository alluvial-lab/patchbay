syntax = "proto3";

package patchbay;

import "google/protobuf/timestamp.proto";

// Distinct protocol id spaces. These wrappers intentionally do not collapse to raw strings.
message CommandId {
  string value = 1;
}

message MessageId {
  string value = 1;
}

message ReplyId {
  string value = 1;
}

message EventId {
  AuthorityDomainId authority_domain_id = 1;
  Lsn lsn = 2;
}

message ElicitationId {
  string value = 1;
}

message Lsn {
  uint64 value = 1;
}

message ActorId {
  string value = 1;
}

message EndpointId {
  string value = 1;
}

message DeviceId {
  string value = 1;
}

message AdapterId {
  string value = 1;
}

message RuntimeSessionId {
  string value = 1;
}

// Stable core identity for one logical target across external runtime replacement.
message LogicalTargetId {
  string value = 1;
}

// Exact adapter-owned external runtime incarnation. Authority-domain scope is
// supplied by the containing event/projection and is never payload-selected.
message ExternalRuntimeRef {
  AdapterId adapter_id = 1;
  string deployment_scope = 2;
  RuntimeSessionId runtime_session_id = 3;
  Generation generation = 4;
}

// Binds a stable logical target to one exact external runtime incarnation.
message RuntimeGenerationRef {
  LogicalTargetId logical_target_id = 1;
  ExternalRuntimeRef external_runtime = 2;
}

// Adapter-local resource identifier. Routable identity also includes the
// owning adapter and adapter-owned resource kind.
message ResourceId {
  string value = 1;
}

// Open adapter-owned resource collection/type identifier. The adapter
// capability manifest owns the admitted set; the core does not enumerate it.
message ResourceKind {
  string value = 1;
}

message ResourceIdentity {
  AdapterId adapter_id = 1;
  ResourceId resource_id = 2;
  ResourceKind resource_kind = 3;
}

message AuthorityDomainId {
  string value = 1;
}

message GrantId {
  string value = 1;
}

message OperatorSessionId {
  string value = 1;
}

message SubscriptionId {
  string value = 1;
}

message Generation {
  uint64 value = 1;
}

message ActorEndpointRef {
  ActorId actor_id = 1;
  EndpointId endpoint_id = 2;
  DeviceId device_id = 3;
  Generation endpoint_generation = 4;
}

message TargetScope {
  TargetScopeKind kind = 1;
  ActorId actor_id = 2;
  AdapterId adapter_id = 3;
  RuntimeSessionId runtime_session_id = 4;
  Generation session_generation = 5;
  string deployment_scope = 6;
  string project_or_group = 7;
  // Tag-preserved audit-only target for principal/endpoint/device records.
  // Operational resource Operations and Grants must use `resource`.
  string legacy_audit_resource_id = 8;
  ResourceIdentity resource = 9;
}

enum TargetScopeKind {
  TARGET_SCOPE_KIND_UNSPECIFIED = 0;
  TARGET_SCOPE_KIND_ACTOR = 1;
  TARGET_SCOPE_KIND_ADAPTER = 2;
  TARGET_SCOPE_KIND_RUNTIME_SESSION = 3;
  TARGET_SCOPE_KIND_PROJECT_SESSION_GROUP = 4;
  TARGET_SCOPE_KIND_FLEET_SUPERVISOR = 5;
  TARGET_SCOPE_KIND_RESOURCE = 6;
  TARGET_SCOPE_KIND_AUTHORITY_DOMAIN = 7;
}

message TypedCorrelation {
  oneof ref {
    CommandId command_id = 1;
    MessageId message_id = 2;
    ReplyId reply_id = 3;
    EventId event_id = 4;
    ElicitationId elicitation_id = 5;
  }
}

enum PayloadContentType {
  PAYLOAD_CONTENT_TYPE_UNSPECIFIED = 0;
  PAYLOAD_CONTENT_TYPE_BINARY = 1;
  PAYLOAD_CONTENT_TYPE_TEXT_UTF8 = 2;
  PAYLOAD_CONTENT_TYPE_JSON = 3;
  PAYLOAD_CONTENT_TYPE_PROTOBUF = 4;
}

message PayloadEnvelope {
  bytes payload = 1;
  PayloadContentType content_type = 2;
  string schema_ref = 3;
}

message TimeWindow {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// Storage-level event envelope. The durable event log stores these; the
// discriminator lets recovery/replay know how to deserialize the payload
// without inspecting its bytes. This is the Generated Contracts approach to
// event-type discrimination: the schema owns the variant set, not a
// hand-maintained byte tag in Rust or SQLite.
//
// One variant per concrete storable message type, not per family — this
// makes replay unambiguous. E.g. STORED_EVENT_KIND_GRANT vs
// STORED_EVENT_KIND_REVOCATION (both are authority-family events but
// different message types that must deserialize differently).
enum StoredEventKind {
  STORED_EVENT_KIND_UNSPECIFIED = 0;
  STORED_EVENT_KIND_OPERATION = 1;
  STORED_EVENT_KIND_OBSERVATION = 2;
  STORED_EVENT_KIND_ELICITATION = 3;
  STORED_EVENT_KIND_GRANT = 4;
  STORED_EVENT_KIND_DESCENDANT_GRANT = 5;
  STORED_EVENT_KIND_REVOCATION = 6;
  STORED_EVENT_KIND_SESSION_STATE = 7;
  // A command lifecycle transition (accepted→delivered→running→terminal).
  // The payload is a serialized CommandTransition (operations.proto).
  // Added by feature-v0-core-acceptance: one event per real transition;
  // late terminal candidates are stale_event Observations, not transitions.
  STORED_EVENT_KIND_COMMAND_TRANSITION = 8;
  // Core-owned operator authentication record (admin.proto).
  STORED_EVENT_KIND_OPERATOR_RECORD = 9;
  // Enrolled, credential-backed control-surface principal (admin.proto).
  STORED_EVENT_KIND_CONTROL_SURFACE_PRINCIPAL = 10;
  // Redacted security audit record (diagnostics.proto). The source event is
  // retained separately; this is a typed explanation/index record.
  STORED_EVENT_KIND_AUDIT_RECORD = 11;
  // Durable operator-session generation fence (admin.proto).
  STORED_EVENT_KIND_OPERATOR_SESSION_REVOCATION = 12;
  // Durable principal/endpoint/device revocation fence (admin.proto).
  STORED_EVENT_KIND_CONTROL_SURFACE_REVOCATION = 13;
  // Durable security lockdown posture transition (security.proto).
  STORED_EVENT_KIND_SECURITY_LOCKDOWN = 14;
  // Durable normalized operational-resource projection update (resources.proto).
  STORED_EVENT_KIND_RESOURCE_STATE = 15;
  // Durable exclusive spawn-generation claim and disposition update
  // (sessions.proto). Command terminality is never interpreted as release.
  STORED_EVENT_KIND_SPAWN_CLAIM = 16;
}

// A durably-recorded state-transition event in the authority-domain log.
// The payload is a serialized Protobuf message whose type is identified by
// `kind`. Storage treats the payload as opaque bytes; the kind is the only
// field storage inspects.
message StoredEventPayload {
  StoredEventKind kind = 1;
  bytes payload = 2;
}

// An idempotency key for boundary deduplication. A key dedups only against
// existing commands to the same target (see docs/PROTOCOL.md § Idempotency
// and retry). The storage layer uses this as the atomic check-and-register
// handle — the formal model's `appliedKeys` set.
message IdempotencyKey {
  string value = 1;
}
