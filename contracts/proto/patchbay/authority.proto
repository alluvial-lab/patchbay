syntax = "proto3";

package patchbay;

import "google/protobuf/timestamp.proto";
import "patchbay/common.proto";
import "patchbay/operations.proto";

message Grant {
  GrantId grant_id = 1;
  AuthorityDomainId authority_domain_id = 2;
  ActorId subject_actor_id = 3;
  EndpointId subject_endpoint_id = 4;
  string subject_endpoint_class = 5;
  TargetScope target_scope = 6;
  repeated OperationKind allowed_operation_kinds = 7;
  google.protobuf.Timestamp created_at = 8;
  GrantProvenance provenance = 9;
  google.protobuf.Timestamp expires_at = 10;
  Generation revocation_generation = 11;
  google.protobuf.Timestamp revoked_at = 12;
  GrantRevocationPolicy revocation_policy = 13;
}

message GrantProvenance {
  ActorEndpointRef created_by = 1;
  CommandId created_by_operation_id = 2;
  EventId audit_id = 3;
  string reason = 4;
}

enum GrantRevocationPolicy {
  GRANT_REVOCATION_POLICY_UNSPECIFIED = 0;
  GRANT_REVOCATION_POLICY_CONTINUE = 1;
  GRANT_REVOCATION_POLICY_CANCEL = 2;
  GRANT_REVOCATION_POLICY_REQUIRE_REAUTHORIZATION = 3;
}

message DescendantGrant {
  GrantId grant_id = 1;
  AuthorityDomainId authority_domain_id = 2;
  ActorId subject_actor_id = 3;
  EndpointId subject_endpoint_id = 4;
  string subject_endpoint_class = 5;
  TargetScope target_scope = 6;
  // Must explicitly enumerate existing-session OperationKinds only: instruct, cancel, interrupt, query,
  // approval-response, elicitation-response, reconfigure, and session-management. Spawn and attach are excluded.
  repeated OperationKind allowed_operation_kinds = 7;
  DescendantGrantProvenance provenance = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp expires_at = 10;
  Generation revocation_generation = 11;
  google.protobuf.Timestamp revoked_at = 12;
  GrantRevocationPolicy revocation_policy = 13;
  EventId audit_id = 14;
}

// Core-selected exact-prior replacement authority for a continuation. This is
// composed with the accepted operation's adapter-scoped spawning Grant; it is
// never accepted from an untrusted SpawnRequest payload.
message ContinuationAuthorityProvenance {
  RuntimeGenerationRef exact_prior = 1;
  GrantId replacement_grant_id = 2;
  // Must be OPERATION_KIND_SESSION_MANAGEMENT. Keeping the kind explicit makes
  // durable security provenance self-describing and fail-closed on replay.
  OperationKind replacement_authority_kind = 3;
}

message DescendantGrantProvenance {
  CommandId spawn_operation_id = 1;
  GrantId spawning_grant_id = 2;
  // Present only for continuation descendants. Together with
  // spawning_grant_id this preserves both authorizing Grant ids.
  ContinuationAuthorityProvenance continuation_authority = 3;
}

// Complete authority contribution carried by the one promotion replay unit.
// The nested descendant is installed directly from SpawnPromotionCommitted;
// it is never emitted first as a standalone grant event.
message SpawnPromotionAuthorityEvidence {
  GrantId spawning_grant_id = 1;
  ContinuationAuthorityProvenance continuation_authority = 2;
  DescendantGrant descendant_grant = 3;
}

message GrantRevocationEffect {
  CommandId command_id = 1;
  OperationState from_state = 2;
  OperationState to_state = 3;
  FailureCode failure_code = 4;
}

message Revocation {
  AuthorityDomainId authority_domain_id = 1;
  GrantId grant_id = 2;
  ActorEndpointRef revoked_by = 3;
  google.protobuf.Timestamp revoked_at = 4;
  Generation revocation_generation = 5;
  GrantRevocationPolicy accepted_operation_policy = 6;
  string reason = 7;
  EventId audit_id = 8;
  repeated GrantRevocationEffect command_effects = 9;
}
