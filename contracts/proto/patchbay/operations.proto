syntax = "proto3";

package patchbay;

import "google/protobuf/timestamp.proto";
import "patchbay/common.proto";

// A durable command lifecycle transition. One event per real transition
// (accept→delivered→running→terminal). The accept itself is an OPERATION
// event (the Operation message); subsequent transitions are
// COMMAND_TRANSITION events. Late terminal candidates are stale_event
// Observations — they never become transition events, which is what makes
// first-durable-terminal-commit-wins structural (the first terminal
// COMMAND_TRANSITION in LSN order wins; later candidates are audit-only).
//
// Mirrors command_lifecycle.qnt: advance/commitTerminal consume an LSN and
// set state; lateTerminalCandidate is a no-op. The from_state is recorded
// for replay validation (Fail Fast on a corrupted log that violates
// adjacency) but the in-memory apply reads only to_state + failure_code.
message CommandTransition {
  CommandId command_id = 1;
  // The state being transitioned INTO. One of OperationState (which refines
  // CommandState per docs/PROTOCOL.md).
  OperationState to_state = 2;
  // The state being transitioned FROM. For replay validation: applying a
  // transition whose from_state doesn't match the current in-memory state
  // indicates log corruption (Fail Fast).
  OperationState from_state = 3;
  // Set on terminal transitions. UNSPECIFIED for non-terminal.
  FailureCode failure_code = 4;
  // When the transition was committed (durable-commit time).
  google.protobuf.Timestamp committed_at = 5;
  // Links to the triggering Observation or response Operation, when there is
  // one. Empty for core-triggered transitions (expired/cancelled/superseded).
  repeated TypedCorrelation correlations = 6;
}

message Operation {
  CommandId command_id = 1;
  AuthorityDomainId authority_domain_id = 2;
  ActorEndpointRef sender = 3;
  ActorEndpointRef recipient = 4;
  OperationKind kind = 5;
  TargetScope target_scope = 6;
  string idempotency_key = 7;
  PayloadEnvelope payload = 8;
  repeated TypedCorrelation correlations = 9;
  TimeWindow validity_window = 10;
  google.protobuf.Timestamp submitted_at = 11;
}

// Generated payload for the single spawn OperationKind. The oneof makes fresh
// creation and exact-prior continuation disjoint wire variants.
message SpawnRequest {
  oneof intent {
    FreshSpawn fresh = 1;
    SpawnContinuation continuation = 2;
  }
  SpawnTargetSpec target_spec = 3;
}

message FreshSpawn {}

message SpawnContinuation {
  RuntimeGenerationRef prior = 1;
}

// Exclusive core-prepared generation claim. The authority domain plus logical
// target plus expected-prior generation is the exclusive key. Fresh claims
// omit expected_prior and consume generation 1; continuations consume exact
// N+1. claim_operation_id prevents a later command from impersonating the
// original claimant.
message SpawnGenerationClaim {
  AuthorityDomainId authority_domain_id = 1;
  CommandId claim_operation_id = 2;
  LogicalTargetId logical_target_id = 3;
  RuntimeGenerationRef expected_prior = 4;
  Generation claimed_generation = 5;
}

// The exact prior-generation delivery fence activated by the same durable
// decision that accepts a continuation claim.
message SpawnPendingReplacementFence {
  RuntimeGenerationRef exact_prior = 1;
  FailureCode failure_code = 2; // must be SUPERSEDED
  string reason_code = 3; // must be replacement_pending
}

enum SpawnPriorWorkDisposition {
  SPAWN_PRIOR_WORK_DISPOSITION_UNSPECIFIED = 0;
  // Accepted before the fence but never offered: terminalize explicitly.
  SPAWN_PRIOR_WORK_DISPOSITION_SUPERSEDED_BEFORE_OFFER = 1;
  // Delivery responsibility or execution may exist: quiesce and reconcile.
  SPAWN_PRIOR_WORK_DISPOSITION_QUIESCE_OUTCOME_RECONCILIATION = 2;
}

// One complete precomputed effect for already-accepted work bound to exact N.
// No hold/queue variant exists: every affected command is explicitly
// superseded or routed to quiesce/outcome reconciliation.
message SpawnPriorWorkEffect {
  CommandId command_id = 1;
  OperationState prior_state = 2;
  SpawnPriorWorkDisposition disposition = 3;
  FailureCode failure_code = 4;
  string reason_code = 5;
}

// Adapter-owned creation parameters. Shape names the adapter-declared variant;
// the opaque payload and local authority reference never become core identity
// or substitute for a Patchbay Grant.
message SpawnTargetSpec {
  string shape = 1;
  PayloadEnvelope adapter_payload = 2;
  string deployment_authority_ref = 3;
}

// A durable acceptance envelope. The ingress request remains a plain
// Operation; the core adds the verified authorizing grant only after the
// authority decision succeeds.
message AcceptedOperation {
  Operation operation = 1;
  GrantId authorizing_grant_id = 2;
}

enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  OPERATION_KIND_SPAWN = 1;
  OPERATION_KIND_ATTACH = 2;
  OPERATION_KIND_INSTRUCT = 3;
  OPERATION_KIND_CANCEL = 4;
  OPERATION_KIND_INTERRUPT = 5;
  OPERATION_KIND_QUERY = 6;
  OPERATION_KIND_APPROVAL_RESPONSE = 7;
  OPERATION_KIND_ELICITATION_RESPONSE = 8;
  OPERATION_KIND_RECONFIGURE = 9;
  OPERATION_KIND_SESSION_MANAGEMENT = 10;
  // reserved, not validatable in v0; submissions reject with validation_failed.
  OPERATION_KIND_RESERVED_AGENT_SEND = 100;
  // reserved, not validatable in v0; submissions reject with validation_failed.
  OPERATION_KIND_RESERVED_ADAPTER_UTILITY_EXEC = 101;
}

// OperationState reuses the CommandState registry by refinement equivalence.
enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_ACCEPTED = 1;
  OPERATION_STATE_DELIVERED = 2;
  OPERATION_STATE_RUNNING = 3;
  OPERATION_STATE_COMPLETED = 4;
  OPERATION_STATE_REJECTED = 5;
  OPERATION_STATE_FAILED = 6;
  OPERATION_STATE_EXPIRED = 7;
  OPERATION_STATE_CANCELLED = 8;
  OPERATION_STATE_SUPERSEDED = 9;
}

enum SubmissionOutcome {
  SUBMISSION_OUTCOME_UNSPECIFIED = 0;
  SUBMISSION_OUTCOME_ACCEPTED = 1;
  SUBMISSION_OUTCOME_REJECTED = 2;
  SUBMISSION_OUTCOME_FAILED = 3;
  SUBMISSION_OUTCOME_UNKNOWN = 4;
}

// LocalSubmissionState is control-surface-local; it is included to keep the committed registry named.
enum LocalSubmissionState {
  LOCAL_SUBMISSION_STATE_UNSPECIFIED = 0;
  LOCAL_SUBMISSION_STATE_DRAFT = 1;
  LOCAL_SUBMISSION_STATE_SUBMITTING = 2;
  LOCAL_SUBMISSION_STATE_SUBMIT_FAILED = 3;
  LOCAL_SUBMISSION_STATE_UNKNOWN = 4;
}

enum FailureCode {
  FAILURE_CODE_UNSPECIFIED = 0;
  FAILURE_CODE_VALIDATION_FAILED = 1;
  FAILURE_CODE_AUTHORIZATION_DENIED = 2;
  FAILURE_CODE_TARGET_NOT_FOUND = 3;
  FAILURE_CODE_UNSUPPORTED_COMMAND = 4;
  FAILURE_CODE_TARGET_OFFLINE = 5;
  FAILURE_CODE_ADAPTER_UNAVAILABLE = 6;
  FAILURE_CODE_TRANSPORT_TIMEOUT = 7;
  FAILURE_CODE_DELIVERY_REJECTED = 8;
  FAILURE_CODE_EXECUTION_FAILED = 9;
  FAILURE_CODE_EXPIRED = 10;
  FAILURE_CODE_CANCELLED = 11;
  FAILURE_CODE_SUPERSEDED = 12;
  FAILURE_CODE_STALE_EVENT = 13;
  FAILURE_CODE_EXECUTION_OUTCOME_UNKNOWN = 14;
}

message SubmissionResult {
  SubmissionOutcome outcome = 1;
  CommandId command_id = 2;
  OperationState operation_state = 3;
  FailureCode failure_code = 4;
  string diagnostic_message = 5;
  Lsn accepted_lsn = 6;
  bool deduplicated = 7;
  // The grant selected for an acceptance decision, or the matching grant
  // explaining a typed denial.
  GrantId decision_grant_id = 8;
  // Bounded lower-snake-case decision vocabulary, distinct from FailureCode.
  string reason_code = 9;
}
