syntax = "proto3";

package patchbay;

import "patchbay/sessions.proto";

// Opaque persisted-entry projection envelopes. The core durably carries these
// as ordinary Observation payloads without interpreting Pi vocabulary. Raw
// session paths, roots, labels, and custom-entry data are intentionally absent.
message PiPersistedProjectionEntry {
  string stable_entry_id = 1;
  string parent_entry_id = 2;
  string content_digest = 3;
  repeated PiPersistedPresentationItem presentation_items = 4;
}

message PiPersistedPresentationItem {
  string membership_id = 1;
  bytes transcript_event_json = 2;
}

message PiPersistedProjectionSuffix {
  string external_continuity_id = 1;
  uint64 replacement_epoch = 2;
  string batch_id = 3;
  string base_cursor_entry_id = 4;
  repeated PiPersistedProjectionEntry entries = 5;
  string cursor_entry_id = 6;
  string leaf_entry_id = 7;
  string tree_digest = 8;
}

message PiPersistedProjectionReplacement {
  string external_continuity_id = 1;
  uint64 replacement_epoch = 2;
  string batch_id = 3;
  repeated PiPersistedProjectionEntry exact_entries = 4;
  string cursor_entry_id = 5;
  string leaf_entry_id = 6;
  string tree_digest = 7;
}

// Generated Pi-local runtime vocabulary carried inside the generic opaque
// AdapterCapability.adapter_profile envelope. Core validation is deliberately
// limited to the outer envelope; the Pi adapter owns semantic decoding.
message PiRuntimeProfile {
  PiTransportMechanism transport = 1;
  PiEventSemantics events = 2;
  PiSessionDurability session_durability = 3;
  PiCursorSemantics cursor = 4;
  PiControlProof control_proof = 5;
  PiReloadBoundary reload = 6;
  repeated PiReloadableResourceKind enumerated_resources = 7;
  PiProjectContextSemantics project_context = 8;
}

enum PiTransportMechanism {
  PI_TRANSPORT_MECHANISM_UNSPECIFIED = 0;
  PI_TRANSPORT_MECHANISM_RPC_JSONL_SUBPROCESS = 1;
}

message PiEventSemantics {
  repeated PiLiveEventCaveat live_event_caveats = 1;
}

enum PiLiveEventCaveat {
  PI_LIVE_EVENT_CAVEAT_UNSPECIFIED = 0;
  PI_LIVE_EVENT_CAVEAT_PARTIAL_ORDER = 1;
  PI_LIVE_EVENT_CAVEAT_PERSISTED_ENTRIES_REQUIRED_FOR_RECONCILIATION = 2;
}

message PiSessionDurability {
  PiSessionMaterializationPolicy materialization_policy = 1;
  PiPreMaterializationState pre_materialization_state = 2;
}

enum PiSessionMaterializationPolicy {
  PI_SESSION_MATERIALIZATION_POLICY_UNSPECIFIED = 0;
  PI_SESSION_MATERIALIZATION_POLICY_AFTER_FIRST_ASSISTANT_MESSAGE = 1;
}

enum PiPreMaterializationState {
  PI_PRE_MATERIALIZATION_STATE_UNSPECIFIED = 0;
  PI_PRE_MATERIALIZATION_STATE_MEMORY_ONLY_NOT_RESUMABLE = 1;
}

message PiCursorSemantics {
  PiCursorMechanism mechanism = 1;
  PiCursorDurabilityCondition durability_condition = 2;
}

enum PiCursorMechanism {
  PI_CURSOR_MECHANISM_UNSPECIFIED = 0;
  PI_CURSOR_MECHANISM_PERSISTED_ENTRY_ID_WITH_EXACT_SET_REPLACEMENT = 1;
}

enum PiCursorDurabilityCondition {
  PI_CURSOR_DURABILITY_CONDITION_UNSPECIFIED = 0;
  PI_CURSOR_DURABILITY_CONDITION_MATERIALIZED_SESSION_ONLY = 1;
}

message PiControlProof {
  PiControlProofKind kind = 1;
}

enum PiControlProofKind {
  PI_CONTROL_PROOF_KIND_UNSPECIFIED = 0;
  PI_CONTROL_PROOF_KIND_CHALLENGED_EXTENSION_CUSTOM_ENTRY = 1;
}

message PiReloadBoundary {
  PiReloadMechanism mechanism = 1;
  PiReloadAdmission admission = 2;
  repeated PiProcessReplacementOnlyKind process_replacement_only = 3;
}

enum PiReloadMechanism {
  PI_RELOAD_MECHANISM_UNSPECIFIED = 0;
  PI_RELOAD_MECHANISM_CONTROL_EXTENSION_CTX_RELOAD = 1;
}

enum PiReloadAdmission {
  PI_RELOAD_ADMISSION_UNSPECIFIED = 0;
  PI_RELOAD_ADMISSION_IDLE_MATERIALIZED_SESSION = 1;
}

enum PiProcessReplacementOnlyKind {
  PI_PROCESS_REPLACEMENT_ONLY_KIND_UNSPECIFIED = 0;
  PI_PROCESS_REPLACEMENT_ONLY_KIND_ARBITRARY_EXTENSION_DEPENDENCY_GRAPH = 1;
  PI_PROCESS_REPLACEMENT_ONLY_KIND_PI_RUNTIME_PACKAGE_DIST = 2;
  PI_PROCESS_REPLACEMENT_ONLY_KIND_NATIVE_DEPENDENCY = 3;
  PI_PROCESS_REPLACEMENT_ONLY_KIND_EXECUTABLE = 4;
  PI_PROCESS_REPLACEMENT_ONLY_KIND_UNKNOWN_SCOPE = 5;
}

message PiProjectContextSemantics {
  PiProjectContextResolution resolution = 1;
  PiCwdProofKind cwd_proof = 2;
}

enum PiProjectContextResolution {
  PI_PROJECT_CONTEXT_RESOLUTION_UNSPECIFIED = 0;
  PI_PROJECT_CONTEXT_RESOLUTION_ADAPTER_RESOLVED_CWD_PROJECT_TRUST_AND_RESOURCE_ROOTS = 1;
}

enum PiCwdProofKind {
  PI_CWD_PROOF_KIND_UNSPECIFIED = 0;
  PI_CWD_PROOF_KIND_CHALLENGED_CONTROL_EXTENSION = 1;
}

// Typed adapter payload carried by the generic SpawnTargetSpec. The reference
// resolves only inside the Pi adapter and must never contain a raw cwd/path.
message PiSpawnTargetSpec {
  string project_context_ref = 1;
  PiContinuationMode continuation_mode = 2;
}

enum PiContinuationMode {
  PI_CONTINUATION_MODE_UNSPECIFIED = 0;
  PI_CONTINUATION_MODE_REQUIRE_RESUME = 1;
  PI_CONTINUATION_MODE_ALLOW_NEW_CONTEXT = 2;
}

// Redacted adapter-specific spawn result. The generic exact claim, execution
// phase, external-effect disposition, successor SessionReport, and promotion
// remain in their shared generated contracts. This payload carries only Pi's
// bounded readiness proof and conditional persistence result.
message PiSpawnResult {
  ContinuationContextStatus continuation_context_status = 1;
  PiSpawnPersistence persistence = 2;
  string readiness_digest = 3;
}

enum PiSpawnPersistence {
  PI_SPAWN_PERSISTENCE_UNSPECIFIED = 0;
  PI_SPAWN_PERSISTENCE_MEMORY_ONLY = 1;
  PI_SPAWN_PERSISTENCE_MATERIALIZED = 2;
}

// Typed Pi-local reconfiguration contract. Reloadable resources remain the
// narrow generated set below; broader changes require process replacement.
message PiReconfigureRequest {
  repeated PiReloadableResourceKind reload_resources = 1;
}

message PiReconfigureResult {
  PiReconfigureOutcome outcome = 1;
  repeated PiProcessReplacementOnlyKind process_replacement_reasons = 2;
}

enum PiReconfigureOutcome {
  PI_RECONFIGURE_OUTCOME_UNSPECIFIED = 0;
  PI_RECONFIGURE_OUTCOME_RELOADED = 1;
  PI_RECONFIGURE_OUTCOME_PROCESS_REPLACEMENT_REQUIRED = 2;
  PI_RECONFIGURE_OUTCOME_BUSY = 3;
  PI_RECONFIGURE_OUTCOME_MATERIALIZATION_REQUIRED = 4;
}

// Adapter-local profile for the control extension. The core may carry the
// runtime profile opaquely; it must never interpret or expose the path-bearing
// marker payloads below.
message PiControlExtensionProfile {
  string profile_version = 1;
  string handshake_command = 2;
  string reload_command = 3;
  string handshake_custom_type = 4;
  string reload_request_custom_type = 5;
  string reload_completion_custom_type = 6;
  uint32 challenge_bytes = 7;
  uint32 extension_epoch_bytes = 8;
  uint32 supported_session_version = 9;
}

// Data stored inside a patchbay.control.handshake.v1 Pi custom entry. Raw cwd
// and session paths are adapter-local evidence and are never core diagnostics.
message PiControlHandshakeMarker {
  string challenge = 1;
  string launch_nonce = 2;
  string extension_epoch = 3;
  string cwd = 4;
  string session_id = 5;
  string session_file = 6;
}

message PiReloadRequestMarker {
  string command_id = 1;
  string nonce = 2;
  string prior_extension_epoch = 3;
  repeated PiReloadableResourceKind resources = 4;
}

message PiReloadCompletionMarker {
  string command_id = 1;
  string nonce = 2;
  string request_entry_id = 3;
  string prior_extension_epoch = 4;
  string extension_epoch = 5;
}

enum PiReloadableResourceKind {
  PI_RELOADABLE_RESOURCE_KIND_UNSPECIFIED = 0;
  PI_RELOADABLE_RESOURCE_KIND_EXTENSION_ENTRYPOINT = 1;
  PI_RELOADABLE_RESOURCE_KIND_SKILL = 2;
  PI_RELOADABLE_RESOURCE_KIND_PROMPT = 3;
  PI_RELOADABLE_RESOURCE_KIND_THEME = 4;
  PI_RELOADABLE_RESOURCE_KIND_CONTEXT_FILE = 5;
}

// Redacted handshake failures. They intentionally cannot carry the challenged
// cwd or session path values.
enum PiControlHandshakeFailure {
  PI_CONTROL_HANDSHAKE_FAILURE_UNSPECIFIED = 0;
  PI_CONTROL_HANDSHAKE_FAILURE_COMMAND_MISSING = 1;
  PI_CONTROL_HANDSHAKE_FAILURE_COMMAND_SOURCE_MISMATCH = 2;
  PI_CONTROL_HANDSHAKE_FAILURE_PROMPT_REJECTED = 3;
  PI_CONTROL_HANDSHAKE_FAILURE_MARKER_MISSING = 4;
  PI_CONTROL_HANDSHAKE_FAILURE_MARKER_AMBIGUOUS = 5;
  PI_CONTROL_HANDSHAKE_FAILURE_CHALLENGE_MISMATCH = 6;
  PI_CONTROL_HANDSHAKE_FAILURE_LAUNCH_NONCE_MISMATCH = 7;
  PI_CONTROL_HANDSHAKE_FAILURE_EXTENSION_EPOCH_MISMATCH = 8;
  PI_CONTROL_HANDSHAKE_FAILURE_CWD_MISMATCH = 9;
  PI_CONTROL_HANDSHAKE_FAILURE_SESSION_ID_MISMATCH = 10;
  PI_CONTROL_HANDSHAKE_FAILURE_SESSION_FILE_MISMATCH = 11;
  PI_CONTROL_HANDSHAKE_FAILURE_RPC_CROSS_CHECK_FAILED = 12;
  PI_CONTROL_HANDSHAKE_FAILURE_MARKER_NOT_CURRENT_LEAF = 13;
  PI_CONTROL_HANDSHAKE_FAILURE_BOUND_EXCEEDED = 14;
}

// Redacted adapter-local failure vocabulary. Values identify a failed
// invariant without carrying cwd, session paths, entry content, or secrets.
enum PiSessionIntegrityFailure {
  PI_SESSION_INTEGRITY_FAILURE_UNSPECIFIED = 0;
  PI_SESSION_INTEGRITY_FAILURE_PATH_MISSING = 1;
  PI_SESSION_INTEGRITY_FAILURE_PATH_OUTSIDE_ALLOWED_ROOT = 2;
  PI_SESSION_INTEGRITY_FAILURE_SYMLINK = 3;
  PI_SESSION_INTEGRITY_FAILURE_NOT_REGULAR_FILE = 4;
  PI_SESSION_INTEGRITY_FAILURE_EMPTY_FILE = 5;
  PI_SESSION_INTEGRITY_FAILURE_FILE_TOO_LARGE = 6;
  PI_SESSION_INTEGRITY_FAILURE_UNSTABLE_FILE = 7;
  PI_SESSION_INTEGRITY_FAILURE_FRAMING_INVALID = 8;
  PI_SESSION_INTEGRITY_FAILURE_JSON_INVALID = 9;
  PI_SESSION_INTEGRITY_FAILURE_HEADER_INVALID = 10;
  PI_SESSION_INTEGRITY_FAILURE_ENTRY_TYPE_UNSUPPORTED = 11;
  PI_SESSION_INTEGRITY_FAILURE_ENTRY_SHAPE_INVALID = 12;
  PI_SESSION_INTEGRITY_FAILURE_DUPLICATE_ENTRY_ID = 13;
  PI_SESSION_INTEGRITY_FAILURE_PARENT_INVALID = 14;
  PI_SESSION_INTEGRITY_FAILURE_TREE_INVALID = 15;
  PI_SESSION_INTEGRITY_FAILURE_REFERENCE_INVALID = 16;
  PI_SESSION_INTEGRITY_FAILURE_RPC_ENTRIES_MISMATCH = 17;
  PI_SESSION_INTEGRITY_FAILURE_RPC_LEAF_MISMATCH = 18;
  PI_SESSION_INTEGRITY_FAILURE_SEAL_IDENTITY_MISMATCH = 19;
  PI_SESSION_INTEGRITY_FAILURE_SEALED_PREFIX_MISMATCH = 20;
  PI_SESSION_INTEGRITY_FAILURE_CONTROL_MARKER_MISMATCH = 21;
  PI_SESSION_INTEGRITY_FAILURE_IO = 22;
}
