syntax = "proto3";

package patchbay;

import "google/protobuf/timestamp.proto";
import "patchbay/common.proto";
import "patchbay/operations.proto";

message AdapterCapability {
  repeated OperationKind supported_operation_kinds = 1;
  repeated string supported_target_spec_shapes = 2;
  bool streaming_support = 3;
  AdapterSnapshotSupport session_snapshot_support = 4;
  bool cancellation_support = 5;
  bool session_replacement_support = 6;
  // Replay-only input for durable pre-assurance registrations. Fresh attach
  // requires UNSPECIFIED and uses assurance.v1.deduplication_strength.
  IdempotencyStrength idempotency_strength = 7 [deprecated = true];
  AttachmentMethod attachment_method = 8;
  repeated FailureCode known_failure_modes = 9;
  AdapterDiagnosticReportingCapability diagnostic_reporting = 10;
  repeated AdapterTargetCategory target_categories = 11;
  repeated ResourceCapability resource_capabilities = 12;
  AdapterAssuranceManifest assurance = 13;
  // Optional adapter-specific generated profile. The core validates only the
  // bounded opaque envelope and never interprets the profile payload.
  PayloadEnvelope adapter_profile = 14;
}

// Versioned, complete declaration of adapter durability and reconciliation
// assurances. V1 is frozen; new semantic dimensions require a new branch.
message AdapterAssuranceManifest {
  oneof contract {
    AdapterAssuranceManifestV1 v1 = 1;
  }
}

message AdapterAssuranceManifestV1 {
  IdempotencyStrength deduplication_strength = 1;
  optional bool continuation_proof_support = 2;
  optional bool cursor_support = 3;
  optional bool generation_fence_support = 4;
  AdapterReconciliationStrength reconciliation_strength = 5;
  ReconciliationAction unproven_outcome_action = 6;
}

enum AdapterReconciliationStrength {
  ADAPTER_RECONCILIATION_STRENGTH_UNSPECIFIED = 0;
  ADAPTER_RECONCILIATION_STRENGTH_NONE = 1;
  ADAPTER_RECONCILIATION_STRENGTH_BOUNDED = 2;
  ADAPTER_RECONCILIATION_STRENGTH_AUTHORITATIVE = 3;
}

enum ReconciliationAction {
  RECONCILIATION_ACTION_UNSPECIFIED = 0;
  RECONCILIATION_ACTION_NONE = 1;
  RECONCILIATION_ACTION_MANUAL_REQUIRED = 2;
}

// Registry-owned adapter target families. Knowledge bundles are wire-present
// for a future promotion whose candidate payload family is OKF v0.2; current
// adapter registration rejects that reserved category.
enum AdapterTargetCategory {
  ADAPTER_TARGET_CATEGORY_UNSPECIFIED = 0;
  ADAPTER_TARGET_CATEGORY_RUNTIME_SESSION = 1;
  ADAPTER_TARGET_CATEGORY_OPERATIONAL_RESOURCE = 2;
  ADAPTER_TARGET_CATEGORY_KNOWLEDGE_BUNDLE = 3;
}

// A schema identity binding. Matching this descriptor does not establish that
// opaque payload bytes semantically conform to the named schema.
message SchemaDescriptor {
  string schema_ref = 1;
  PayloadContentType content_type = 2;
}

message ResourceProjectionContract {
  AdapterTargetCategory target_category = 1;
  SchemaDescriptor payload_schema = 2;
  SchemaDescriptor projection_schema = 3;
}

message ResourceCapability {
  ResourceKind resource_kind = 1;
  AdapterSnapshotSupport snapshot_support = 2;
  ResourceProjectionContract projection_contract = 3;
}

message AdapterDiagnosticReportingCapability {
  repeated string diagnostic_codes = 1;
}

enum IdempotencyStrength {
  IDEMPOTENCY_STRENGTH_UNSPECIFIED = 0;
  IDEMPOTENCY_STRENGTH_NONE = 1;
  IDEMPOTENCY_STRENGTH_AT_PATCHBAY_BOUNDARY = 2;
  IDEMPOTENCY_STRENGTH_END_TO_END = 3;
}

enum AdapterSnapshotSupport {
  ADAPTER_SNAPSHOT_SUPPORT_UNSPECIFIED = 0;
  ADAPTER_SNAPSHOT_SUPPORT_AUTHORITATIVE = 1;
  ADAPTER_SNAPSHOT_SUPPORT_PARTIAL = 2;
  ADAPTER_SNAPSHOT_SUPPORT_NONE = 3;
}

message AttachmentMethod {
  string kind = 1;
  bytes descriptor = 2;
  PayloadContentType descriptor_content_type = 3;
}

message AdapterRegistration {
  AdapterId adapter_id = 1;
  EndpointId endpoint_id = 2;
  AuthorityDomainId authority_domain_id = 3;
  Generation adapter_generation = 4;
  AdapterCapability capability = 5;
  Lsn attach_lsn = 6;
  google.protobuf.Timestamp attached_at = 7;
}
