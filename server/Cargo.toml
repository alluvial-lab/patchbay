[package]
name = "patchbay-core-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
patchbay-contracts = { path = "../contracts/rust" }
patchbay-core = { path = "../core" }
base64 = "0.22"
rand = "0.8"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["server", "transport"] }
tonic-prost = "0.14"
tonic-types = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[bin]]
name = "patchbay-core-server"
path = "src/main.rs"
